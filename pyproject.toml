[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bestbill"
version = "1.1.0"
description = "Which electricity offer is cheapest for your own consumption, in under a minute."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "shellcheck-py>=0.10,<1",
]

[project.scripts]
bestbill = "bestbill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bestbill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
markers = [
  "slow: local-only tests that need the full ARERA source files (see BESTBILL_ARERA_FIXTURES_DIR)",
]

[tool.coverage.run]
source = ["bestbill"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["bestbill"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
