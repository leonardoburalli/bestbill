name: Catalog

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    name: Fetch, build and publish the ARERA catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: .cicd/install.sh

      - name: Download the previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/previous
          gh release download catalog-latest -p manifest.json -D build/previous \
            --repo "${{ github.repository }}" || true

      - name: Build and validate the catalogue
        env:
          PREVIOUS_MANIFEST: build/previous/manifest.json
        run: .cicd/catalog.sh

      - name: Upload catalogue as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            build/catalog/catalog.sqlite
            build/catalog/manifest.json
          retention-days: 7

      - name: Publish to the catalog-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if ! gh release view catalog-latest --repo "${REPO}" >/dev/null 2>&1; then
            gh release create catalog-latest \
              --repo "${REPO}" \
              --title "Catalogue (latest)" \
              --notes "Rolling daily ARERA Portale Offerte catalogue snapshot." \
              --latest=false
          fi
          gh release upload catalog-latest \
            build/catalog/catalog.sqlite build/catalog/manifest.json \
            --repo "${REPO}" --clobber

          SNAPSHOT_DATE=$(jq -r '.snapshot_date' build/catalog/manifest.json)
          INCLUDED=$(jq -r '.counts.included' build/catalog/manifest.json)
          EXCLUDED=$(jq -r '.counts.excluded' build/catalog/manifest.json)
          ATTRIBUTION=$(jq -r '.attribution' build/catalog/manifest.json)
          gh release edit catalog-latest \
            --repo "${REPO}" \
            --notes "Snapshot date: ${SNAPSHOT_DATE}
Offers included: ${INCLUDED} — excluded: ${EXCLUDED}

${ATTRIBUTION}"
